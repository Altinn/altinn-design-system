name: Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "The type of release (one of 'patch' or 'minor')"
        required: true
        default: patch
        type: choice
        options:
        - patch
        - minor

jobs:
  build_release:
    name: Build & release
    runs-on: ubuntu-20.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: "16.x"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        env:
          GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: Prepare release version
        # This step runs if the trigger is run manually; the version is created by calling `yarn release`
        if: ${{ ! github.event.after }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          npm version  ${{ github.event.inputs.release_type }}
          echo "release_version=`git describe`" >> $GITHUB_ENV
          git push --follow-tags

      - name: Publish npm package
        run: yarn npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.release_version }}
          release_name: Release ${{ env.release_version }}
          draft: false
          prerelease: false

      - name: Build Storybook
        run: yarn build-storybook

      - name: Deploy Storybook
        uses: JamesIves/github-pages-deploy-action@22a6ee251d6f13c6ab1ecb200d974f1a6feb1b8d # v4.4.2
        with:
          branch: gh-pages
          folder: storybook-static # Source folder (output from build step)
